name: M7350-V3-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib g++-multilib \
            lib32z1 lib32stdc++6 lib32gcc-s1 \
            zlib1g:i386 libncurses5:i386 libstdc++6:i386 \
            libncurses5-dev flex bison gawk gettext texinfo \
            unzip rsync cpio file wget \
            libffi-dev libreadline-dev libbz2-dev libsqlite3-dev diffstat chrpath
          gcc --version | head -1

      - name: Download GPL source
        continue-on-error: true
        run: |
          set +e
          URL1="https://static.tp-link.com/resources/gpl/M7350v3_en_gpl.tar.gz"
          URL2="https://archive.org/download/tp-link-gpl-source/Home/Mobile%20Wi-Fi/M7350/M7350v3_en_gpl.tar.gz"
          wget --tries=2 -c "$URL1" -O M7350v3_en_gpl.tar.gz
          SIZE1=$(stat -c %s M7350v3_en_gpl.tar.gz 2>/dev/null || echo 0)
          echo "URL1 size=$SIZE1"
          if [ "$SIZE1" -lt 500000000 ]; then
            if [ "$SIZE1" -lt 1000000 ]; then rm -f M7350v3_en_gpl.tar.gz; fi
            echo "URL1 incomplete — falling back to archive.org"
            wget -c "$URL2" -O M7350v3_en_gpl.tar.gz
            echo "URL2 exit=$?"
          fi
          md5sum M7350v3_en_gpl.tar.gz
          md5sum M7350v3_en_gpl.tar.gz | grep -q 0337a736e30cb11f83161bc15d53fac5 \
            && echo "MD5 OK" \
            || echo "MD5 MISMATCH"

      - name: Extract source tree
        continue-on-error: true
        run: |
          set +e
          mkdir -p src
          tar -xzf M7350v3_en_gpl.tar.gz -C src 2> tar-errors.txt
          echo "tar exit=$?"
          echo "extracted files: $(find src -type f | wc -l)"
          du -sh src

      - name: Build Python 2.7 (Yocto-era SDK requires it)
        continue-on-error: true
        run: |
          set +e
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/py2 --with-ensurepip=no > ../py2-configure.log 2>&1
          make -j4 -s > ../py2-make.log 2>&1
          echo "make exit=$?"
          sudo make install > ../py2-install.log 2>&1
          echo "install exit=$?"
          sudo ln -sf /opt/py2/bin/python2 /opt/py2/bin/python
          /opt/py2/bin/python --version

      - name: Dump TP-Link's own build config
        continue-on-error: true
        run: |
          set +e
          {
            echo "===== oe-core/build/conf contents ====="
            ls -la src/apps_proc/oe-core/build/conf/ 2>/dev/null
            for f in set_bb_env.sh local.conf bblayers.conf site.conf auto.conf; do
              if [ -f "src/apps_proc/oe-core/build/conf/$f" ]; then
                echo "===== $f ====="
                cat "src/apps_proc/oe-core/build/conf/$f"
              fi
            done
            echo "===== mdm9625.conf (machine) ====="
            cat src/apps_proc/oe-core/meta-msm/conf/machine/mdm9625.conf
            echo "===== msm.conf (distro) ====="
            cat src/apps_proc/oe-core/meta-msm/conf/distro/msm.conf
            echo "===== mdm-image.bb ====="
            cat src/apps_proc/oe-core/meta-msm/recipes/images/mdm-image.bb
            echo "===== mdm-perf-image.bb ====="
            cat src/apps_proc/oe-core/meta-msm/recipes/images/mdm-perf-image.bb
            echo "===== downloads count ====="
            ls src/apps_proc/oe-core/build/downloads 2>/dev/null | wc -l
          } | tee tp-conf.txt

      - name: Full build attempt (bitbake mdm-image)
        continue-on-error: true
        run: |
          set +e
          export PATH=/opt/py2/bin:$PATH
          export WSDIR="$PWD"
          echo "python: $(python --version 2>&1), cores: $(nproc)"
          cd src/apps_proc/oe-core
          . ./oe-init-build-env build > "$WSDIR/init.log" 2>&1
          echo "init exit=$?"
          # αν το target βρεθεί στις ρυθμίσεις της TP-Link, χρησιμοποίησέ το
          TARGET=$(grep -rhoE "bitbake [a-zA-Z0-9-]+" "$BUILDDIR/conf/" 2>/dev/null | head -1 | awk '{print $2}')
          if [ -z "$TARGET" ] || ! ls meta-msm/recipes/images/ | grep -q "^$TARGET"; then
            TARGET=mdm-image
          fi
          echo "BUILDING TARGET: $TARGET"
          BB_NUMBER_THREADS=4 PARALLEL_MAKE="-j4" timeout 12600 bitbake "$TARGET" > "$WSDIR/bitbake-build.log" 2>&1
          RC=$?
          echo "bitbake exit=$RC"
          tail -60 "$WSDIR/bitbake-build.log"
          echo "===== DEPLOYED IMAGES ====="
          find "$BUILDDIR/tmp-eglibc/deploy/images" -type f 2>/dev/null | head -40
          exit 0

      - name: Upload logs and images
        uses: actions/upload-artifact@v4
        with:
          name: m7350-v3-build-output
          path: |
            tp-conf.txt
            init.log
            bitbake-build.log
            py2-*.log
            tar-errors.txt
            src/apps_proc/oe-core/build/tmp-eglibc/deploy/images/**
          if-no-files-found: warn
          retention-days: 30
