name: M7350-V3-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:14.04
    timeout-minutes: 350

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential gcc-multilib g++-multilib libncurses5-dev flex bison gawk gettext texinfo texi2html unzip rsync cpio file wget curl subversion libffi-dev libreadline-dev libbz2-dev libsqlite3-dev diffstat chrpath zlib1g-dev lib32z1 lib32stdc++6 xz-utils bzip2 git python-minimal autoconf automake libtool intltool libglib2.0-dev openssh-client sudo libxml2-dev pkg-config help2man make gcc g++
          useradd -m builder
          ln -sf /bin/bash /bin/sh

      - name: Download and extract GPL source
        shell: bash
        run: |
          wget "https://static.tp-link.com/resources/gpl/M7350v3_en_gpl.tar.gz" -O gpl.tar.gz
          echo "0337a736e30cb11f83161bc15d53fac5  gpl.tar.gz" | md5sum -c -
          mkdir -p src
          tar -xzf gpl.tar.gz -C src || true
          echo "files: $(find src -type f | wc -l)"
          chown -R builder:builder /__w/m7350/m7350

      - name: Apply build system fixes
        shell: bash
        run: |
          cd src/apps_proc/oe-core
          sed -i 's/^PRODUCT_MEMORY .*/PRODUCT_MEMORY = ""/' meta-msm/recipes/samba/samba_3.6.22.bb
          echo '# stub' > meta-msm/classes/tp-link-common.bbclass
          sed -i '42,52d' meta-msm/conf/site.conf 2>/dev/null
          for f in staging package libc-package sourcepkg; do sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' meta/classes/$f.bbclass; done
          sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' meta/lib/oe/path.py
          sed -i 's/^PRODUCT_MEMORY .*/PRODUCT_MEMORY = ""/' meta-msm/recipes/samba/samba_3.6.22.bb
          sed -i 's/^DEPENDS = "acdbloader glib-2.0"/DEPENDS = "glib-2.0"/' meta-msm/recipes/alsa-intf/alsa-intf_git.bb
          sed -i 's/^DEPENDS = "qmi-framework glib-2.0 libhardware"/DEPENDS = "glib-2.0 libhardware"/' meta-msm/recipes/loc-api/loc-api_git.bb
          sed -i 's/^DEPENDS = "openssl qmi"/DEPENDS = "openssl"/' meta-msm/recipes/hostap/hostap_git.bb
          sed -i 's/^DEPENDS += "qmi"/DEPENDS += ""/' meta-msm/recipes/wpa-supplicant/wpa-supplicant-ath6kl_git.bb
          sed -i 's/^DEPENDS = "data"/DEPENDS = ""/' meta-msm/recipes/miniupnpd/miniupnpd_1.8.20130521.bb
          sed -i '/kernel-tests \\/d' meta-msm/recipes/images/mdm-bootimg.inc
          chown -R builder:builder /__w/m7350/m7350

      - name: Write build script
        shell: bash
        run: |
          cat > /tmp/build.sh << 'SCRIPT'
          cd /__w/m7350/m7350/src/apps_proc/oe-core
          . build/conf/set_bb_env.sh
          export MACHINE=mdm9625
          echo 'PREFERRED_VERSION_m4-native = "1.4.19"' >> ${TOPDIR}/build/conf/local.conf
          echo 'PREFERRED_VERSION_m4 = "1.4.19"' >> ${TOPDIR}/build/conf/local.conf
          echo 'PREFERRED_VERSION_pseudo-native = "1.9.0"' >> ${TOPDIR}/build/conf/local.conf
          bitbake mdm-image
          echo "mdm-image exit=$?"
          find ${TOPDIR}/tmp-eglibc/deploy/images -type f 2>/dev/null | head -50
          SCRIPT
          chown builder:builder /tmp/build.sh
          chmod +x /tmp/build.sh

      - name: Apply recipe-level fixes
        shell: bash
        run: |
          cd src/apps_proc/oe-core
          EGD=meta/recipes-core/eglibc
          sed -i "s|svn://www.eglibc.org/svn/branches/;module=\${EGLIBC_BRANCH};proto=http \\\\|https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.13.orig.tar.gz \\\\|" "$EGD/eglibc_2.13.bb"
          sed -i 's|^S = "${WORKDIR}/${EGLIBC_BRANCH}/libc"|S = "${WORKDIR}/eglibc-2.13"|' "$EGD/eglibc_2.13.bb"
          sed -i '/^PR_append = "+svnr/d' "$EGD/eglibc_2.13.bb"
          echo 'SRC_URI[md5sum] = "17695e0d2d84d0a0f68c652f6ad4af7c"' >> "$EGD/eglibc_2.13.bb"
          GCCD=meta/recipes-devtools/gcc
          sed -i 's|^PV = .*|PV = "4.6.4"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^BINV = .*|BINV = "4.6.4"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^S = .*|S = "${TMPDIR}/work-shared/gcc-${PV}-${PR}/gcc-4.6.4"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^B = .*|B = "${WORKDIR}/gcc-4.6.4/build.${HOST_SYS}.${TARGET_SYS}"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^SRC_URI = "svn://gcc.gnu.org/svn/gcc/branches;module=${BRANCH};proto=http \\|SRC_URI = "https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-core-4.6.4.tar.bz2;name=gcccore \\|' "$GCCD/gcc-4.6.inc"
          sed -i '/file:\/\/.*uclibc/d; /gcc-flags-for-build.patch/d; /^.*file:\/\/.*\.patch/d' "$GCCD/gcc-4.6.inc"
          echo 'EXTRA_OEMAKE_append = " MAKEINFO=true"' >> "$GCCD/gcc-4.6.inc"
          echo 'CFLAGS_append = " -fno-strict-aliasing"' >> "$GCCD/gcc-4.6.inc"
          echo 'LICENSE = "GPL-3.0-with-GCC-exception & GPLv3"' >> "$GCCD/gcc-4.6.inc"
          echo 'LICENSE = "GPL-3.0-with-GCC-exception & GPLv3"' >> "$GCCD/gcc-crosssdk-initial_4.6.bb"
          echo 'LICENSE = "GPL-3.0-with-GCC-exception & GPLv3"' >> "$GCCD/gcc-crosssdk-initial.inc"
          echo 'LICENSE = "GPL-3.0-with-GCC-exception & GPLv3"' >> "$GCCD/gcc-cross_4.6.bb"
          echo 'LICENSE = "GPL-3.0-with-GCC-exception & GPLv3"' >> "$GCCD/gcc-runtime_4.6.bb"
          echo 'require gcc-cross-initial.inc' > "$GCCD/gcc-cross-initial_4.6.bb"
          echo 'LICENSE = "GPL-3.0-with-GCC-exception & GPLv3"' >> "$GCCD/gcc-cross-initial_4.6.bb"
          echo 'do_compile() {' >> "$GCCD/gcc-cross-initial_4.6.bb"
          echo '    oe_runmake all-gcc' >> "$GCCD/gcc-cross-initial_4.6.bb"
          echo '}' >> "$GCCD/gcc-cross-initial_4.6.bb"
          sed -i '42,52d' meta-msm/conf/site.conf 2>/dev/null
          for f in staging package libc-package sourcepkg; do sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' meta/classes/$f.bbclass; done
          sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' meta/lib/oe/path.py
          sed -i 's/^PRODUCT_MEMORY .*/PRODUCT_MEMORY = ""/' meta-msm/recipes/samba/samba_3.6.22.bb
          echo '# stub' > meta-msm/classes/tp-link-common.bbclass
          find meta/recipes-core/gettext -name "stdio.in.h" -exec sed -i '/_GL_WARN_ON_USE (gets/d' {} \; 2>/dev/null
          sed -i 's|https://fedorahosted.org/releases/e/l/elfutils/elfutils-${PV}.tar.bz2|https://sourceware.org/elfutils/0.148/elfutils-0.148.tar.bz2|' meta/recipes-devtools/elfutils/elfutils_0.148.bb
          sed -i 's|http://git-core.googlecode.com/files/git-${PV}.tar.gz|https://www.kernel.org/pub/software/scm/git/git-${PV}.tar.gz|' meta/recipes-devtools/git/git_1.7.7.bb 2>/dev/null
          echo 'EXTRA_OEMAKE_append = " MAKEINFO=true"' >> meta/recipes-devtools/binutils/binutils_2.22.bb
          echo 'EXTRA_OEMAKE_append = " MAKEINFO=true"' >> meta/recipes-devtools/binutils/binutils-cross_2.22.bb
          NCD=meta/recipes-core/ncurses
          echo 'EXTRA_OECONF += "--without-cxx-binding"' >> "$NCD/ncurses_5.9.bb"
          echo '# stub' > meta-msm/classes/tp-link-common.bbclass
          # m4 1.4.16 gnulib gets fix
          M4D=meta/recipes-devtools/m4
          echo 'do_compile_prepend() {' >> "$M4D/m4-native_1.4.16.bb"
          echo '    for f in ${S}/lib/stdio.h ${B}/lib/stdio.h; do' >> "$M4D/m4-native_1.4.16.bb"
          echo '        [ -f $f ] && sed -i "/_GL_WARN_ON_USE (gets/d; /^# undef gets$/d" $f 2>/dev/null || true' >> "$M4D/m4-native_1.4.16.bb"
          echo '    done' >> "$M4D/m4-native_1.4.16.bb"
          echo '}' >> "$M4D/m4-native_1.4.16.bb"
          chown -R builder:builder /__w/m7350/m7350

      - name: Pre-download sources
        shell: bash
        run: |
          DL=src/apps_proc/oe-core/build/downloads
          mkdir -p $DL
          for pair in \
            "pseudo-1.2.tar.bz2 https://downloads.yoctoproject.org/releases/pseudo/pseudo-1.2.tar.bz2" \
            "gcc-core-4.6.4.tar.bz2 https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-core-4.6.4.tar.bz2" \
            "gcc-g++-4.6.4.tar.bz2 https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-g++-4.6.4.tar.bz2" \
            "eglibc_2.13.orig.tar.gz https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.13.orig.tar.gz" \
            "eglibc_2.12.1.orig.tar.gz https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.12.1.orig.tar.gz" \
            "binutils-2.22.tar.bz2 https://ftp.gnu.org/gnu/binutils/binutils-2.22.tar.bz2"; do
            fname=$(echo $pair | cut -d' ' -f1)
            url=$(echo $pair | cut -d' ' -f2)
            if [ ! -f "$DL/$fname.done" ]; then
              echo "Pre-downloading $fname"
              wget -q "$url" -O "$DL/$fname" || true
              touch "$DL/$fname.done"
            fi
          done
          chown -R builder:builder $DL

      - name: Run TP-Link build
        shell: bash
        run: |
          su - builder -c "/tmp/build.sh"

      - name: Upload logs and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7350-v3-build-output
          path: |
            /tmp/build.log
            src/apps_proc/oe-core/build/tmp-eglibc/deploy/images/**
          if-no-files-found: warn
          retention-days: 30
