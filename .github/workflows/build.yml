name: M7350-V3-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:14.04
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential gcc-multilib g++-multilib libncurses5-dev flex bison gawk gettext texinfo texi2html unzip rsync cpio file wget curl subversion libffi-dev libreadline-dev libbz2-dev libsqlite3-dev diffstat chrpath zlib1g-dev lib32z1 lib32stdc++6 xz-utils bzip2 git autoconf automake libtool intltool libglib2.0-dev sudo libxml2-dev pkg-config help2man make gawk

      - name: Download and extract GPL
        shell: bash
        run: |
          wget "https://static.tp-link.com/resources/gpl/M7350v3_en_gpl.tar.gz" -O gpl.tar.gz
          echo "0337a736e30cb11f83161bc15d53fac5  gpl.tar.gz" | md5sum -c -
          mkdir -p src
          tar -xzf gpl.tar.gz -C src || true
          echo "files: $(find src -type f | wc -l)"

      - name: Apply fixes and build
        shell: bash
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          OE=src/apps_proc/oe-core
          cd $OE

          # Install Python 2.7 (needed by Yocto)
          apt-get install -y python2.7 python
          ln -sf /usr/bin/python2.7 /usr/bin/python

          # Fix /bin/sh -> bash
          ln -sf /bin/bash /bin/sh

          # Remove dead mirrors
          sed -i '42,52d' meta-msm/conf/site.conf 2>/dev/null

          # tar -ps fix
          for f in staging package libc-package sourcepkg; do
            sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' meta/classes/$f.bbclass
          done
          sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' meta/lib/oe/path.py

          # samba PRODUCT_MEMORY
          sed -i 's/^PRODUCT_MEMORY .*/PRODUCT_MEMORY = ""/' meta-msm/recipes/samba/samba_3.6.22.bb

          # tp-link-common stub
          echo '# stub' > meta-msm/classes/tp-link-common.bbclass

          # Remove dependency on missing packages
          sed -i 's/^DEPENDS = "acdbloader glib-2.0"/DEPENDS = "glib-2.0"/' meta-msm/recipes/alsa-intf/alsa-intf_git.bb
          sed -i 's/^DEPENDS = "qmi-framework glib-2.0 libhardware"/DEPENDS = "glib-2.0 libhardware"/' meta-msm/recipes/loc-api/loc-api_git.bb
          sed -i 's/^DEPENDS = "openssl qmi"/DEPENDS = "openssl"/' meta-msm/recipes/hostap/hostap_git.bb
          sed -i 's/^DEPENDS += "qmi"/DEPENDS += ""/' meta-msm/recipes/wpa-supplicant/wpa-supplicant-ath6kl_git.bb
          sed -i 's/^DEPENDS = "data"/DEPENDS = ""/' meta-msm/recipes/miniupnpd/miniupnpd_1.8.20130521.bb
          sed -i '/kernel-tests \\/d' meta-msm/recipes/images/mdm-bootimg.inc

          # gcc: use 4.6.4 tarballs
          GCCD=meta/recipes-devtools/gcc
          sed -i 's|^PV = .*|PV = "4.6.4"|' $GCCD/gcc-4.6.inc
          sed -i 's|^BINV = .*|BINV = "4.6.4"|' $GCCD/gcc-4.6.inc
          sed -i 's|^S = .*|S = "${TMPDIR}/work-shared/gcc-${PV}-${PR}/gcc-4.6.4"|' $GCCD/gcc-4.6.inc
          sed -i 's|^B = .*|B = "${WORKDIR}/gcc-4.6.4/build.${HOST_SYS}.${TARGET_SYS}"|' $GCCD/gcc-4.6.inc
          sed -i 's|^SRC_URI = "svn://gcc.gnu.org/svn/gcc/branches;module=${BRANCH};proto=http \\|SRC_URI = "https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-core-4.6.4.tar.bz2;name=gcccore \\\n\t   https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-g++-4.6.4.tar.bz2;name=gccgpp \\|' $GCCD/gcc-4.6.inc
          echo 'SRC_URI[gcccore.md5sum] = "ffb7878e23d915358c820d0392e22750"' >> $GCCD/gcc-4.6.inc
          echo 'SRC_URI[gccgpp.md5sum] = "7fa36715b57a2cb9bfc66bac4ecb1b84"' >> $GCCD/gcc-4.6.inc
          sed -i '/file:\/\/.*uclibc/d' $GCCD/gcc-4.6.inc
          sed -i '/gcc-flags-for-build.patch/d' $GCCD/gcc-4.6.inc
          sed -i '/^.*file:\/\/.*\.patch/d' $GCCD/gcc-4.6.inc
          echo 'EXTRA_OEMAKE_append = " MAKEINFO=true"' >> $GCCD/gcc-4.6.inc
          echo 'do_compile() {' > $GCCD/gcc-cross-initial_4.6.bb
          echo '    oe_runmake all-gcc' >> $GCCD/gcc-cross-initial_4.6.bb
          echo '}' >> $GCCD/gcc-cross-initial_4.6.bb

          # eglibc: launchpad tarballs
          EGD=meta/recipes-core/eglibc
          sed -i "s|svn://www.eglibc.org/svn/branches/;module=\${EGLIBC_BRANCH};proto=http \\\\|https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.13.orig.tar.gz \\\\|" $EGD/eglibc_2.13.bb
          sed -i 's|^S = "${WORKDIR}/${EGLIBC_BRANCH}/libc"|S = "${WORKDIR}/eglibc-2.13"|' $EGD/eglibc_2.13.bb
          sed -i '/^PR_append = "+svnr/d' $EGD/eglibc_2.13.bb
          echo 'SRC_URI[md5sum] = "17695e0d2d84d0a0f68c652f6ad4af7c"' >> $EGD/eglibc_2.13.bb
          sed -i "s|svn://www.eglibc.org/svn/branches/;module=\${EGLIBC_BRANCH};proto=http |https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.12.1.orig.tar.gz |" $EGD/cross-localedef-native_2.13.bb
          sed -i 's|^S = "${WORKDIR}/${EGLIBC_BRANCH}/localedef"|S = "${WORKDIR}/eglibc-2.12.1/localedef"|' $EGD/cross-localedef-native_2.13.bb
          sed -i 's|^LIC_DIR = "${WORKDIR}/${EGLIBC_BRANCH}/libc"|LIC_DIR = "${WORKDIR}/eglibc-2.12.1"|' $EGD/cross-localedef-native_2.13.bb
          sed -i 's|--with-glibc=${WORKDIR}/${EGLIBC_BRANCH}/libc|--with-glibc=${WORKDIR}/eglibc-2.12.1|' $EGD/cross-localedef-native_2.13.bb

          # ncurses
          echo 'EXTRA_OECONF += "--without-cxx-binding"' >> meta/recipes-core/ncurses/ncurses_5.9.bb

          # binutils MAKEINFO
          echo 'EXTRA_OEMAKE_append = " MAKEINFO=true"' >> meta/recipes-devtools/binutils/binutils_2.22.bb
          echo 'EXTRA_OEMAKE_append = " MAKEINFO=true"' >> meta/recipes-devtools/binutils/binutils-cross_2.22.bb

          # gettext gets fix
          find meta/recipes-core/gettext -name "stdio.in.h" -exec sed -i '/_GL_WARN_ON_USE (gets/d' {} \;

          # elfutils URL fix
          sed -i 's|https://fedorahosted.org/releases/e/l/elfutils/elfutils-${PV}.tar.bz2|https://sourceware.org/elfutils/0.148/elfutils-0.148.tar.bz2|' meta/recipes-devtools/elfutils/elfutils_0.148.bb

          # git URL fix
          sed -i 's|http://git-core.googlecode.com/files/git-${PV}.tar.gz|https://www.kernel.org/pub/software/scm/git/git-${PV}.tar.gz|' meta/recipes-devtools/git/git_1.7.7.bb
          sed -i 's|http://git-core.googlecode.com/files/git-${PV}.tar.gz|https://www.kernel.org/pub/software/scm/git/git-${PV}.tar.gz|' meta-msm/recipes/git/git-native_1.7.7.bb

          # Pre-download critical sources
          DL=build/downloads
          mkdir -p $DL
          wget -q "https://downloads.yoctoproject.org/releases/pseudo/pseudo-1.2.tar.bz2" -O $DL/pseudo-1.2.tar.bz2
          touch $DL/pseudo-1.2.tar.bz2.done
          wget -q "https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-core-4.6.4.tar.bz2" -O $DL/gcc-core-4.6.4.tar.bz2
          touch $DL/gcc-core-4.6.4.tar.bz2.done
          wget -q "https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-g++-4.6.4.tar.bz2" -O $DL/gcc-g++-4.6.4.tar.bz2
          touch $DL/gcc-g++-4.6.4.tar.bz2.done
          wget -q "https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.13.orig.tar.gz" -O $DL/eglibc_2.13.orig.tar.gz
          touch $DL/eglibc_2.13.orig.tar.gz.done
          wget -q "https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.12.1.orig.tar.gz" -O $DL/eglibc_2.12.1.orig.tar.gz
          touch $DL/eglibc_2.12.1.orig.tar.gz.done
          wget -q "https://ftp.gnu.org/gnu/binutils/binutils-2.22.tar.bz2" -O $DL/binutils-2.22.tar.bz2
          touch $DL/binutils-2.22.tar.bz2.done

          # Build
          . build/conf/set_bb_env.sh
          export MACHINE=mdm9625
          echo 'PREFERRED_VERSION_m4-native = "1.4.19"' >> build/conf/local.conf
          echo 'PREFERRED_VERSION_pseudo-native = "1.9.0"' >> build/conf/local.conf
          echo 'BB_NUMBER_PARSE_THREADS = "1"' >> build/conf/local.conf
          echo 'INHERIT_remove = "sanity"' >> build/conf/local.conf

          bitbake -p > ../parse.log 2>&1
          echo "parse exit=$?"
          if grep -q "^ERROR" ../parse.log; then
            echo "PARSE FAILED"
            tail -30 ../parse.log
          else
            bitbake -k mdm-image > ../bitbake-mdm.log 2>&1
            echo "mdm-image exit=$?"
            tail -30 ../bitbake-mdm.log
            echo "===== DEPLOYED IMAGES ====="
            find tmp-eglibc/deploy/images -type f 2>/dev/null | head -50
          fi

      - name: Upload logs and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7350-v3-build-output
          path: |
            src/apps_proc/oe-core/parse.log
            src/apps_proc/oe-core/bitbake-mdm.log
            src/apps_proc/oe-core/init.log
            src/apps_proc/oe-core/build/downloads/*.done
          if-no-files-found: warn
          retention-days: 30
