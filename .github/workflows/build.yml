name: M7350-V3-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib g++-multilib \
            lib32z1 lib32stdc++6 lib32gcc-s1 \
            zlib1g:i386 libncurses5:i386 libstdc++6:i386 \
            libncurses5-dev flex bison gawk gettext texinfo \
            unzip rsync cpio file wget screen \
            libffi-dev libreadline-dev libbz2-dev libsqlite3-dev diffstat chrpath texi2html subversion
          gcc --version | head -1

      - name: Download GPL source
        continue-on-error: true
        run: |
          set +e
          URL1="https://static.tp-link.com/resources/gpl/M7350v3_en_gpl.tar.gz"
          URL2="https://archive.org/download/tp-link-gpl-source/Home/Mobile%20Wi-Fi/M7350/M7350v3_en_gpl.tar.gz"
          wget --tries=2 -c "$URL1" -O M7350v3_en_gpl.tar.gz
          SIZE1=$(stat -c %s M7350v3_en_gpl.tar.gz 2>/dev/null || echo 0)
          echo "URL1 size=$SIZE1"
          if [ "$SIZE1" -lt 500000000 ]; then
            if [ "$SIZE1" -lt 1000000 ]; then rm -f M7350v3_en_gpl.tar.gz; fi
            echo "URL1 incomplete — falling back to archive.org"
            wget -c "$URL2" -O M7350v3_en_gpl.tar.gz
            echo "URL2 exit=$?"
          fi
          md5sum M7350v3_en_gpl.tar.gz
          md5sum M7350v3_en_gpl.tar.gz | grep -q 0337a736e30cb11f83161bc15d53fac5 \
            && echo "MD5 OK" \
            || echo "MD5 MISMATCH"

      - name: Extract source tree
        continue-on-error: true
        run: |
          set +e
          mkdir -p src
          tar -xzf M7350v3_en_gpl.tar.gz -C src 2> tar-errors.txt
          echo "tar exit=$?"
          echo "extracted files: $(find src -type f | wc -l)"
          # samba recipe: DDR_SIZE δεν ορίζεται πουθενά στο GPL — neutralize η έκφραση
          sed -i 's|^PRODUCT_MEMORY .*|PRODUCT_MEMORY = ""|' src/apps_proc/oe-core/meta-msm/recipes/samba/samba_3.6.22.bb
          grep -n "^PRODUCT_MEMORY" src/apps_proc/oe-core/meta-msm/recipes/samba/samba_3.6.22.bb
          # site.conf: σβήσε το νεκρό PREMIRRORS μπλοκ (γραμμές 42-52)
          sed -i '42,52d' src/apps_proc/oe-core/meta-msm/conf/site.conf
          grep -c "PREMIRRORS" src/apps_proc/oe-core/meta-msm/conf/site.conf || echo "PREMIRRORS μπλοκ: καθαρό"
          # Modern tar (>=1.32): το "-ps" με -c είναι fatalError — παλιά αγνοούνταν.
          # Διόρθωση και στα 4 classes με tar staging pipes.
          for f in staging package libc-package sourcepkg; do
            sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' "src/apps_proc/oe-core/meta/classes/$f.bbclass"
          done
          sed -i 's/ -ps \. | tar -xf -/ . | tar -xpf -/' src/apps_proc/oe-core/meta/lib/oe/path.py
          grep -n "tar -xpf" src/apps_proc/oe-core/meta/lib/oe/path.py
          # m4 1.4.16: gnulib bugs (gets/c-stack) με modern glibc — αναβάθμιση σε 1.4.19
          M4D=src/apps_proc/oe-core/meta/recipes-devtools/m4
          cp "$M4D/m4-1.4.16.inc" "$M4D/m4-1.4.19.inc"
          sed -i 's/^PR = "r2"/PR = "r0"/' "$M4D/m4-1.4.19.inc"
          sed -i '/ac_config_links/d' "$M4D/m4-1.4.19.inc"
          sed -i 's/d32239bcb673463ab874e80d47fae504/1ebbd3e34237af26da5dc08a4e440464/' "$M4D/m4-1.4.19.inc"
          sed -i 's/fbc986d45b3dae6725c29870dd6b669d/4031593b2166d6c47cae282d944a7ede/' "$M4D/m4-1.4.19.inc"
          sed -i 's|^SRC_URI\[md5sum\].*|SRC_URI[md5sum] = "f4a2b0284d80353b995f8ef2385ed73c"|' "$M4D/m4-1.4.19.inc"
          sed -i 's|^SRC_URI\[sha256sum\].*|SRC_URI[sha256sum] = "3be4a26d825ffdfda52a56fc43246456989a3630093cced3fbddf4771ee58a70"|' "$M4D/m4-1.4.19.inc"
          cp "$M4D/m4-native_1.4.16.bb" "$M4D/m4-native_1.4.19.bb"
          # bypass QA gettext check: το native m4 δεν χρειάζεται gettext
          echo '' >> "$M4D/m4-native_1.4.19.bb"
          echo 'do_configure_prepend() {' >> "$M4D/m4-native_1.4.19.bb"
          echo '    sed -i "/AM_GNU_GETTEXT/d" ${S}/configure.ac' >> "$M4D/m4-native_1.4.19.bb"
          echo '}' >> "$M4D/m4-native_1.4.19.bb"
          echo 'EXTRA_OECONF += "--disable-nls"' >> "$M4D/m4-native_1.4.19.bb"
          echo 'do_configure_append() {' >> "$M4D/m4-native_1.4.19.bb"
          echo '    sed -i "/^SUBDIRS/,/^$/s/\\bpo\\b//" ${S}/Makefile 2>/dev/null || true' >> "$M4D/m4-native_1.4.19.bb"
          echo '    printf "all:\ninstall:\nclean:\ndistclean:\ncheck:\n" > ${S}/po/Makefile' >> "$M4D/m4-native_1.4.19.bb"
          echo '}' >> "$M4D/m4-native_1.4.19.bb"
          cat "$M4D/m4-1.4.19.inc" "$M4D/m4-native_1.4.19.bb"
          grep -rn "tar -xpf" src/apps_proc/oe-core/meta/classes/ | head -5
          # automake 1.11.2: skip info docs (texinfo 6 incompatibility) — άδειο doc/Makefile
          AMD=src/apps_proc/oe-core/meta/recipes-devtools/automake
          rm -f "$AMD/automake_1.11.2.bbappend"
          echo '' >> "$AMD/automake_1.11.2.bb"
          echo 'do_configure_append() {' >> "$AMD/automake_1.11.2.bb"
          echo '    printf "all:\\ninstall:\\nclean:\\ndistclean:\\ncheck:\\n" > ${S}/doc/Makefile' >> "$AMD/automake_1.11.2.bb"
          echo '}' >> "$AMD/automake_1.11.2.bb"
          # pkgconfig 0.25: bundled glib 2.28 breaks με gcc>=10 (gnu11 inline + no-common)
          PKGD=src/apps_proc/oe-core/meta/recipes-devtools/pkgconfig
          echo '' >> "$PKGD/pkgconfig_0.25.bb"
          echo 'CFLAGS += "-fcommon -std=gnu89"' >> "$PKGD/pkgconfig_0.25.bb"
          echo 'LDFLAGS += "-Wl,--allow-multiple-definition"' >> "$PKGD/pkgconfig_0.25.bb"
          echo 'do_configure_append() {' >> "$PKGD/pkgconfig_0.25.bb"
          echo '    for f in $(find ${S} -name Makefile); do' >> "$PKGD/pkgconfig_0.25.bb"
          echo '        sed -i "s/^LDFLAGS = /LDFLAGS = -Wl,--allow-multiple-definition /" $f' >> "$PKGD/pkgconfig_0.25.bb"
          echo '    done' >> "$PKGD/pkgconfig_0.25.bb"
          echo '    for f in $(find ${S}/glib-1.2.10 -name Makefile 2>/dev/null); do' >> "$PKGD/pkgconfig_0.25.bb"
          echo '        sed -i "s/testgdateparser//; s/testgdate//; s/testgmodule//; s/testglib//" $f' >> "$PKGD/pkgconfig_0.25.bb"
          echo '        sed -i "s/^CFLAGS = /CFLAGS = -std=gnu89 -fcommon /" $f' >> "$PKGD/pkgconfig_0.25.bb"
          echo '    done' >> "$PKGD/pkgconfig_0.25.bb"
          echo '}' >> "$PKGD/pkgconfig_0.25.bb"
          # pseudo 1.2 χρησιμοποιεί _STAT_VER (αφαιρέθηκε από glibc 2.28+) — αναβάθμιση σε 1.9.0
          PSD=src/apps_proc/oe-core/meta/recipes-devtools/pseudo
          { echo 'require pseudo.inc'
            echo ''
            echo 'PR = "r0"'
            echo ''
            echo 'SRC_URI = "http://downloads.yoctoproject.org/releases/pseudo/pseudo-1.9.0.tar.bz2"'
            echo ''
            echo 'SRC_URI[md5sum] = "7ec8409bccdbd9c958367469b6059071"'
            echo 'SRC_URI[sha256sum] = "a3f150cc55b2fa009c9411335981b55675ead4e5cb4a9c36ed40b32f81d020c1"'
            echo ''
            echo '# glibc 2.33+ αφαίρεσε τα public _STAT_VER/_MKNOD_VER — τα ορίζουμε στα sources'
            echo 'CFLAGS += "-D_STAT_VER=1 -D_MKNOD_VER=1"'
            echo 'do_compile_prepend_virtclass-native() {' >> "$PSD/pseudo_1.9.0.bb"
            echo '    for f in $(find ${S}/ports -name "*.c"); do' >> "$PSD/pseudo_1.9.0.bb"
            echo '        grep -q _STAT_VER $f && sed -i "1i #define _STAT_VER 1" $f || true' >> "$PSD/pseudo_1.9.0.bb"
            echo '        grep -q _MKNOD_VER $f && sed -i "1i #define _MKNOD_VER 1" $f || true' >> "$PSD/pseudo_1.9.0.bb"
            echo '    done' >> "$PSD/pseudo_1.9.0.bb"
            echo '    sed -i "s/^} pseudo_access_t;\$/};/" ${S}/pseudo_ipc.h' >> "$PSD/pseudo_1.9.0.bb"
            echo '}' >> "$PSD/pseudo_1.9.0.bb"
          } > "$PSD/pseudo_1.9.0.bb"
          # gcc 4.6: το SVN του gcc.gnu.org retired — release tarballs 4.6.4 από ftp.gnu.org
          GCCD=src/apps_proc/oe-core/meta/recipes-devtools/gcc
          sed -i 's|^PV = .*|PV = "4.6.4"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^BINV = .*|BINV = "4.6.4"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^S = "${TMPDIR}/work-shared/gcc-${PV}-${PR}/${BRANCH}"|S = "${TMPDIR}/work-shared/gcc-${PV}-${PR}/gcc-4.6.4"|' "$GCCD/gcc-4.6.inc"
          sed -i 's|^B = "${WORKDIR}/${BRANCH}/build.${HOST_SYS}.${TARGET_SYS}"|B = "${WORKDIR}/gcc-4.6.4/build.${HOST_SYS}.${TARGET_SYS}"|' "$GCCD/gcc-4.6.inc"
          # miniupnpd: αφαίρεση missing 'data' dependency
          sed -i 's|^DEPENDS = "data"|DEPENDS = ""|' src/apps_proc/oe-core/meta-msm/recipes/miniupnpd/miniupnpd_1.8.20130521.bb
          # wpa-supplicant-ath6kl / hostap: αφαίρεση missing 'qmi' dependency
          sed -i 's/^DEPENDS += "qmi"/DEPENDS += ""/' src/apps_proc/oe-core/meta-msm/recipes/wpa-supplicant/wpa-supplicant-ath6kl_git.bb
          sed -i 's/^DEPENDS = "openssl qmi"/DEPENDS = "openssl"/' src/apps_proc/oe-core/meta-msm/recipes/hostap/hostap_git.bb
          sed -i 's|^SRC_URI = "svn://gcc.gnu.org/svn/gcc/branches;module=${BRANCH};proto=http \\|SRC_URI = "https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-core-4.6.4.tar.bz2;name=gcccore \\\n\t   https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-g++-4.6.4.tar.bz2;name=gccgpp \\|' "$GCCD/gcc-4.6.inc"
          { echo 'SRC_URI[gcccore.md5sum] = "ffb7878e23d915358c820d0392e22750"'
            echo 'SRC_URI[gcccore.sha256sum] = "48b566f1288f099dff8fba868499a320f83586245ec69b8c82a9042566a5bf62"'
            echo 'SRC_URI[gccgpp.md5sum] = "7fa36715b57a2cb9bfc66bac4ecb1b84"'
            echo 'SRC_URI[gccgpp.sha256sum] = "4eaa347f9cd3ab7d5e14efbb9c5c03009229cd714b558fc55fa56e8996b74d42"'
          } >> "$GCCD/gcc-4.6.inc"
          grep -A3 "^SRC_URI" "$GCCD/gcc-4.6.inc" | head -5
          # uclibc patches: αδιάφορα για glibc build και δεν ταιριάζουν στο 4.6.4 release — remove
          sed -i '/file:\/\/.*uclibc/d' "$GCCD/gcc-4.6.inc"
          grep -c "uclibc" "$GCCD/gcc-4.6.inc" || echo "uclibc patches: καθαρά"
          sed -i '/gcc-flags-for-build.patch/d' "$GCCD/gcc-4.6.inc"
          # αφαίρεση ΟΛΩΝ των παλιών patches — vanilla 4.6.4
          sed -i '/^.*file:\/\/.*\.patch/d' "$GCCD/gcc-4.6.inc"
          grep -c "\.patch" "$GCCD/gcc-4.6.inc" || echo "gcc patches: καθαρά"
          # bison 2.5: gnulib gets bug — καθαρισμός generated stdio.h
          BD=src/apps_proc/oe-core/meta/recipes-devtools/bison
          echo '' >> "$BD/bison_2.5.bb"
          echo 'do_compile_prepend() {' >> "$BD/bison_2.5.bb"
          echo '    printf "#include <stdio.h>\\n\\nvoid\\nfseterr (FILE *fp)\\n{\\n  (void) fp;\\n}\\n" > ${S}/lib/fseterr.c' >> "$BD/bison_2.5.bb"
          echo '    for f in ${S}/lib/stdio.h ${B}/lib/stdio.h; do' >> "$BD/bison_2.5.bb"
          echo '        [ -f $f ] && sed -i "/^#undef gets$/d; /_GL_WARN_ON_USE (gets/d" $f || true' >> "$BD/bison_2.5.bb"
          echo '    done' >> "$BD/bison_2.5.bb"
          echo '    for f in ${S}/config.h ${B}/config.h; do' >> "$BD/bison_2.5.bb"
          echo '        [ -f $f ] && echo "#define HAVE___FSETERR 1" >> $f || true' >> "$BD/bison_2.5.bb"
          echo '    done' >> "$BD/bison_2.5.bb"
          echo '}' >> "$BD/bison_2.5.bb"
          # bison: regen-proof patches στα templates
          echo 'do_configure_append() {' >> "$BD/bison_2.5.bb"
          echo '    sed -i "/_GL_WARN_ON_USE (gets/d; /^# undef gets$/d" ${S}/lib/stdio.in.h || true' >> "$BD/bison_2.5.bb"
          echo '    echo "#define HAVE___FSETERR 1" >> ${S}/config.h.in' >> "$BD/bison_2.5.bb"
          echo '}' >> "$BD/bison_2.5.bb"
          # linux-libc-headers 3.1: headers εγκαθίστανται read-only → chmod πριν το cleanup
          LLH=src/apps_proc/oe-core/meta/recipes-kernel/linux-libc-headers
          echo '' >> "$LLH/linux-libc-headers_3.1.bb"
          echo 'do_install() {' >> "$LLH/linux-libc-headers_3.1.bb"
          echo '    set_arch' >> "$LLH/linux-libc-headers_3.1.bb"
          echo '    oe_runmake headers_install INSTALL_HDR_PATH=${D}${exec_prefix} ARCH=$ARCH' >> "$LLH/linux-libc-headers_3.1.bb"
          echo '    rm -f ${D}${exec_prefix}/include/scsi/scsi.h || true' >> "$LLH/linux-libc-headers_3.1.bb"
          echo '}' >> "$LLH/linux-libc-headers_3.1.bb"
          # alsa-intf: αφαίρεση acdbloader (δεν υπάρχει στο GPL)
          sed -i 's/^DEPENDS = "acdbloader glib-2.0"/DEPENDS = "glib-2.0"/' src/apps_proc/oe-core/meta-msm/recipes/alsa-intf/alsa-intf_git.bb
          grep -n "^DEPENDS" src/apps_proc/oe-core/meta-msm/recipes/alsa-intf/alsa-intf_git.bb
          # mdm-bootimg: αφαίρεση του ανύπαρκτου kernel-tests package
          sed -i '/kernel-tests \\/d' src/apps_proc/oe-core/meta-msm/recipes/images/mdm-bootimg.inc
          grep -c "kernel-tests" src/apps_proc/oe-core/meta-msm/recipes/images/mdm-bootimg.inc || echo "kernel-tests: αφαιρέθηκε"
          # eglibc 2.13: το SVN του eglibc.org είναι νεκρό — Launchpad orig tarballs
          EGD=src/apps_proc/oe-core/meta/recipes-core/eglibc
          sed -i 's|^SRC_URI = "svn://www.eglibc.org/svn/branches/;module=${EGLIBC_BRANCH};proto=http \\|SRC_URI = "https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.13.orig.tar.gz \\|' "$EGD/eglibc_2.13.bb"
          sed -i 's|^S = "${WORKDIR}/${EGLIBC_BRANCH}/libc"|S = "${WORKDIR}/eglibc-2.13"|' "$EGD/eglibc_2.13.bb"
          sed -i '/^PR_append = "+svnr/d' "$EGD/eglibc_2.13.bb"
          echo 'SRC_URI[md5sum] = "17695e0d2d84d0a0f68c652f6ad4af7c"' >> "$EGD/eglibc_2.13.bb"
          grep -n "^SRC_URI\|^S =\|md5sum" "$EGD/eglibc_2.13.bb" | head -4
          # cross-localedef (eglibc-2_12 branch → 2.12.1 tarball)
          sed -i 's|^SRC_URI = "svn://www.eglibc.org/svn/branches/;module=${EGLIBC_BRANCH};proto=http "|SRC_URI = "https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.12.1.orig.tar.gz"|' "$EGD/cross-localedef-native_2.13.bb"
          sed -i 's|^S = "${WORKDIR}/${EGLIBC_BRANCH}/localedef"|S = "${WORKDIR}/eglibc-2.12.1/localedef"|' "$EGD/cross-localedef-native_2.13.bb"
          sed -i 's|^LIC_DIR = "${WORKDIR}/${EGLIBC_BRANCH}/libc"|LIC_DIR = "${WORKDIR}/eglibc-2.12.1"|' "$EGD/cross-localedef-native_2.13.bb"
          sed -i 's|--with-glibc=${WORKDIR}/${EGLIBC_BRANCH}/libc|--with-glibc=${WORKDIR}/eglibc-2.12.1|' "$EGD/cross-localedef-native_2.13.bb"
          echo 'SRC_URI[md5sum] = "99637e034aed7ddfb6056715e69d8e19"' >> "$EGD/cross-localedef-native_2.13.bb"
          # binutils 2.22: gold options.cc pointer comparison με modern g++
          BUD=src/apps_proc/oe-core/meta/recipes-devtools/binutils
          echo 'CXXFLAGS += "-fpermissive -Wno-narrowing"' >> "$BUD/binutils-cross_2.22.bb"
          echo 'do_compile_prepend() {' >> "$BUD/binutils-cross_2.22.bb"
          echo '    sed -i "s/ || retval < 0)/ || *retval < 0)/" ${S}/gold/options.cc 2>/dev/null || true' >> "$BUD/binutils-cross_2.22.bb"
          echo '    for f in $(find ${S} ${B} -name Makefile 2>/dev/null); do sed -i "s/^CXXFLAGS = /CXXFLAGS = -fpermissive -Wno-narrowing /" $f; done' >> "$BUD/binutils-cross_2.22.bb"
          echo '}' >> "$BUD/binutils-cross_2.22.bb"
          # openssl-native: perlpath.pl require find.pl — modern perl χρειάζεται PERL5LIB
          OSD=src/apps_proc/oe-core/meta/recipes-connectivity/openssl
          echo '' >> "$OSD/openssl_1.0.0f.bb"
          echo 'do_configure_prepend() {' >> "$OSD/openssl_1.0.0f.bb"
          echo '    echo  | base64 -d > ${S}/util/perlpath.pl' >> "$OSD/openssl_1.0.0f.bb"
          echo '    export PERL5LIB="${S}/util:${S}:$PERL5LIB"' >> "$OSD/openssl_1.0.0f.bb"
          echo '}' >> "$OSD/openssl_1.0.0f.bb"
          echo 'do_compile_prepend() {' >> "$OSD/openssl_1.0.0f.bb"
          echo '    export PERL5LIB="${S}/util:${S}:$PERL5LIB"' >> "$OSD/openssl_1.0.0f.bb"
          echo '}' >> "$OSD/openssl_1.0.0f.bb"
          # loc-api: αφαίρεση qmi-framework (δεν υπάρχει στο GPL)
          sed -i 's/^DEPENDS = "qmi-framework glib-2.0 libhardware"/DEPENDS = "glib-2.0 libhardware"/' src/apps_proc/oe-core/meta-msm/recipes/loc-api/loc-api_git.bb
          grep -n "^DEPENDS" src/apps_proc/oe-core/meta-msm/recipes/loc-api/loc-api_git.bb
          # Stub: το tp-link-common.bbclass λείπει από το GPL (το κληρονομεί μόνο το libcjson)
          printf '# Minimal stub: tp-link-common.bbclass missing from GPL tarball\n' > src/apps_proc/oe-core/meta-msm/classes/tp-link-common.bbclass
          ls src/apps_proc/oe-core/meta-msm/classes/
          ls src/apps_proc/oe-core/build/conf/
          find src -name "buildname.bbclass" || echo "buildname.bbclass NOT SHIPPED (θα το παρακάμψουμε)"

      - name: Build Python 2.7 (Yocto-era SDK requires it)
        continue-on-error: true
        run: |
          set +e
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/py2 --with-ensurepip=no > ../py2-configure.log 2>&1
          make -j4 -s > ../py2-make.log 2>&1
          echo "make exit=$?"
          sudo make install > ../py2-install.log 2>&1
          echo "install exit=$?"
          sudo ln -sf /opt/py2/bin/python2 /opt/py2/bin/python
          /opt/py2/bin/python --version

      - name: "Full build - TP-Link set_bb_env.sh procedure, bitbake mdm-image"
        continue-on-error: true
        run: |
          set +e
          export PATH=/opt/py2/bin:$PATH
          export WSDIR="$PWD"
          echo "python: $(python --version 2>&1)"
          cd src/apps_proc/oe-core
          # Patch bitbake ΠΡΙΝ το sourcing (το set_bb_env.sh αλλάζει CWD):
          # όταν αποτυγχάνει expansion, να λέει και το αρχείο
          sed -i 's|^    except:|    except Exception as e:|' bitbake/lib/bb/data.py
          sed -i 's|bb.note("Error expanding variable %s" % key)|bb.note("Error expanding variable %s in FILE=%s DETAIL=%s" % (key, d.getVar("FILE", True), str(e)))|' bitbake/lib/bb/data.py
          echo "===== bitbake patch verification ====="
          grep -n "Error expanding variable" bitbake/lib/bb/data.py
          # Η επίσημη διαδικασία της TP-Link: παράγει bblayers.conf (όλα τα meta*)
          # και κάνει source το oe-init-build-env μέσα της.
          . build/conf/set_bb_env.sh > "$WSDIR/init.log" 2>&1
          echo "set_bb_env exit=$? — CWD: $(pwd)"
          echo "===== conf/bblayers.conf ====="
          cat conf/bblayers.conf
          # Το GPL δεν περιλαμβάνει το buildname.bbclass της TP-Link — παρακάμψη:
          sed -i 's/^USER_CLASSES.*/USER_CLASSES = "image-mklibs image-prelink"/' conf/local.conf
          sed -i 's|^BUILDNAME.*|BUILDNAME = "M7350V3-custom"|' conf/local.conf
          grep -q "^DDR_SIZE" conf/local.conf || echo 'DDR_SIZE = "512M"' >> conf/local.conf
          # τα mirrors του 2014 (codeaurora/autobuilder) είναι νεκρά και γυρνάνε 0-byte
          # αρχεία που σπάνε τα checksums — κλείνε τα, άσε τα upstream originals
          echo 'PREMIRRORS = "http://.*/.* https://sources.openembedded.org/ \n ftp://.*/.* https://sources.openembedded.org/ \n"' >> conf/local.conf
          echo 'MIRRORS = ""' >> conf/local.conf
          echo 'PREFERRED_VERSION_m4-native = "1.4.19"' >> conf/local.conf
          echo 'PREFERRED_VERSION_m4 = "1.4.19"' >> conf/local.conf
          echo 'PREFERRED_VERSION_pseudo-native = "1.9.0"' >> conf/local.conf
          find downloads -type f -size 0 -delete 2>/dev/null
          grep -E "^(USER_CLASSES|BUILDNAME|DDR_SIZE|PREMIRRORS|MIRRORS)" conf/local.conf
          echo "===== PARSE PROBE (single-threaded, deterministic) ====="
          cp conf/bblayers.conf "$WSDIR/bblayers-generated.conf"
          BB_NUMBER_PARSE_THREADS=1 bitbake -p -DD > "$WSDIR/parse.log" 2>&1
          echo "parse exit=$?"
          grep -n "Error expanding" "$WSDIR/parse.log" | head -5
          if grep -q "Error expanding" "$WSDIR/parse.log"; then
            echo "===== FAILURE CONTEXT ====="
            tail -40 "$WSDIR/parse.log"
            exit 0
          fi
          tail -10 "$WSDIR/parse.log"
          echo "===== PRE-SEED MISSING DOWNLOADS ====="
          seed() {
            f="downloads/$1"; shift; want="$1"; shift
            if [ -s "$f" ] && [ "$(md5sum "$f" | cut -d' ' -f1)" = "$want" ]; then
              touch "$f.done"
              echo "OK (checksum ταιριάζει): $f"; return 0
            fi
            [ -f "$f" ] && echo "EXISTING corrupt: $f — αντικατάσταση..."
            for u in "$@"; do
              wget -q --timeout=40 --tries=2 "$u" -O "$f" 2>/dev/null
              if [ -s "$f" ] && [ "$(md5sum "$f" | cut -d' ' -f1)" = "$want" ]; then
                touch "$f.done"
                echo "SEEDED: $f  <-  $u"; return 0
              fi
            done
            echo "SEED FAILED: $f"; rm -f "$f"; return 1
          }
          seed quilt-0.50.tar.gz ff5e1e041363c3af3c8fda4b968c9d1d \
            https://download.savannah.gnu.org/releases/quilt/quilt-0.50.tar.gz \
            http://download.savannah.nongnu.org/releases/quilt/quilt-0.50.tar.gz
          seed gnu-config-yocto-20111111.tgz 30be385c919a25cd9522205ef49e5328 \
            https://downloads.yoctoproject.org/releases/gnu-config/gnu-config-yocto-20111111.tgz
          seed m4-1.4.16.tar.gz a5dfb4f2b7370e9d34293d23fd09b280 \
            https://ftp.gnu.org/gnu/m4/m4-1.4.16.tar.gz
          seed autoconf-2.68.tar.bz2 864d785215aa60d627c91fcb21b05b07 \
            https://ftp.gnu.org/gnu/autoconf/autoconf-2.68.tar.bz2
          seed pseudo-1.2.tar.bz2 a2819084bab7e991f06626d02cf55048 \
            https://downloads.yoctoproject.org/releases/pseudo/pseudo-1.2.tar.bz2 \
            https://sources.openembedded.org/pseudo-1.2.tar.bz2
          seed zlib-1.2.5.tar.bz2 be1e89810e66150f5b0327984d8625a0 \
            https://zlib.net/fossils/zlib-1.2.5.tar.bz2 \
            https://sources.openembedded.org/zlib-1.2.5.tar.bz2
          seed flex-2.5.35.tar.bz2 10714e50cea54dc7a227e3eddcd44d57 \
            https://sources.openembedded.org/flex-2.5.35.tar.bz2
          seed mpc-0.8.2.tar.gz e98267ebd5648a39f881d66797122fb6 \
            https://sources.openembedded.org/mpc-0.8.2.tar.gz
          seed eglibc_2.13.orig.tar.gz 17695e0d2d84d0a0f68c652f6ad4af7c \
            https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.13.orig.tar.gz
          seed eglibc_2.12.1.orig.tar.gz 99637e034aed7ddfb6056715e69d8e19 \
            https://launchpad.net/ubuntu/+archive/primary/+files/eglibc_2.12.1.orig.tar.gz
          seed expat-2.0.1.tar.gz ee8b492592568805593f81f8cdf2a04c \
            https://sources.openembedded.org/expat-2.0.1.tar.gz \
            https://github.com/libexpat/libexpat/releases/download/R_2_0_1/expat-2.0.1.tar.gz \
            http://deb.debian.org/debian/pool/main/e/expat/expat_2.0.1.orig.tar.gz
          # το pseudo-1.2 του tarball είναι εξακριβωμένο (md5+sha256) — σφράγισέ το
          touch downloads/pseudo-1.2.tar.bz2.done
          echo "===== FULL BUILD: mdm-image ====="
          BB_NUMBER_THREADS=4 PARALLEL_MAKE="-j4" timeout 12000 bitbake mdm-image > "$WSDIR/bitbake-mdm.log" 2>&1
          echo "mdm-image exit=$?"
          tail -40 "$WSDIR/bitbake-mdm.log"
          echo "===== RECOVERY IMAGE ====="
          timeout 2400 bitbake mdm-recovery-image > "$WSDIR/bitbake-recovery.log" 2>&1
          echo "recovery exit=$?"
          tail -15 "$WSDIR/bitbake-recovery.log"
          echo "===== FAILURE LOGS ====="
          mkdir -p "$WSDIR/faillogs"
          grep -rl "Function failed" tmp-eglibc/work/*/*/temp/ 2>/dev/null | head -5 | xargs -r -I{} cp -L {} "$WSDIR/faillogs/" 2>/dev/null
          ls -la "$WSDIR/faillogs/" 2>/dev/null
          echo "===== DEPLOYED IMAGES ====="
          find tmp-eglibc/deploy/images -type f 2>/dev/null | head -50
          exit 0

      - name: Upload logs and images
        uses: actions/upload-artifact@v4
        with:
          name: m7350-v3-build-output
          path: |
            init.log
            parse.log
            bblayers-generated.conf
            bitbake-mdm.log
            bitbake-recovery.log
            py2-*.log
            tar-errors.txt
            faillogs/**
            src/apps_proc/oe-core/build/tmp-eglibc/deploy/images/**
          if-no-files-found: warn
          retention-days: 30
