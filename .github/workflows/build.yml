name: M7350-V3-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:14.04
    timeout-minutes: 350

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential gcc-multilib g++-multilib \
            libncurses5-dev flex bison gawk gettext texinfo texi2html \
            unzip rsync cpio file wget curl subversion \
            libffi-dev libreadline-dev libbz2-dev libsqlite3-dev \
            diffstat chrpath zlib1g-dev lib32z1 lib32stdc++6 \
            xz-utils bzip2 git python-minimal autoconf automake \
            libtool intltool libglib2.0-dev openssh-client sudo \
            libxml2-dev pkg-config help2man make gcc g++

      - name: Download GPL source
        shell: bash
        run: |
          wget --tries=2 "https://static.tp-link.com/resources/gpl/M7350v3_en_gpl.tar.gz" -O gpl.tar.gz
          echo "0337a736e30cb11f83161bc15d53fac5  gpl.tar.gz" | md5sum -c -

      - name: Extract source tree
        shell: bash
        run: |
          mkdir -p src
          tar -xzf gpl.tar.gz -C src
          echo "files: $(find src -type f | wc -l)"
          du -sh src

      - name: Build with TP-Link procedure
        shell: bash
        run: |
          cd src/apps_proc/oe-core
          . build/conf/set_bb_env.sh

          # TP-Link's build9625 procedure
          export MACHINE=mdm9625
          bitbake mdm-image
          echo "mdm-image exit=$?"

          # Deployed images
          echo "===== DEPLOYED IMAGES ====="
          find ${TOPDIR}/tmp-eglibc/deploy/images -type f 2>/dev/null | head -50

      - name: Upload logs and images
        uses: actions/upload-artifact@v4
        with:
          name: m7350-v3-build-output
          path: |
            init.log
            src/apps_proc/oe-core/build/tmp-eglibc/deploy/images/**
          if-no-files-found: warn
          retention-days: 30
