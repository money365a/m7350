name: M7350-V3-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gcc-multilib g++-multilib \
            lib32z1 lib32stdc++6 lib32gcc-s1 \
            zlib1g:i386 libncurses5:i386 libstdc++6:i386 \
            libncurses5-dev flex bison gawk gettext texinfo \
            unzip rsync cpio file wget
          gcc --version | head -1

      - name: Download GPL source (official URL, archive.org fallback)
        run: |
          URL1="https://static.tp-link.com/resources/gpl/M7350v3_en_gpl.tar.gz"
          URL2="https://archive.org/download/tp-link-gpl-source/Home/Mobile%20Wi-Fi/M7350/M7350v3_en_gpl.tar.gz"
          wget -q --tries=2 "$URL1" -O M7350v3_en_gpl.tar.gz \
            || wget -c "$URL2" -O M7350v3_en_gpl.tar.gz
          echo "0337a736e30cb11f83161bc15d53fac5  M7350v3_en_gpl.tar.gz" | md5sum -c -

      - name: Extract and document the source tree
        run: |
          mkdir -p src
          tar -xzf M7350v3_en_gpl.tar.gz -C src
          {
            echo "===== TOP LEVEL ====="
            ls -la src
            echo "===== READMEs ====="
            find src -maxdepth 2 -type f -iname "readme*" | sort | while read -r f; do
              echo "----- $f -----"
              head -120 "$f"
            done
            echo "===== Build scripts ====="
            find src -maxdepth 3 -type f -name "*.sh" | sort | head -30 | while read -r f; do
              echo "----- $f -----"
              head -80 "$f"
            done
            echo "===== Toolchain dirs ====="
            find src -maxdepth 3 -type d \( -iname "*toolchain*" -o -iname "*gcc*" \) | head -20
          } | tee recon.txt

      - name: First build attempt (non-fatal, recon run)
        run: |
          cd src
          set +e
          for s in build.sh Build.sh ap/build.sh; do
            if [ -f "$s" ]; then
              echo "===== Running $s =====" | tee ../build.log
              bash "$s" 2>&1 | tee -a ../build.log
              break
            fi
          done
          if [ ! -s ../build.log ]; then
            make -j2 2>&1 | tee ../build.log
          fi
          echo "===== IMAGES PRODUCED =====" | tee -a ../build.log
          find . -type f \( -name "*.bin" -o -name "*.img" -o -name "*.trx" \) -newer ../recon.txt -exec ls -la {} \; | tee -a ../build.log
          exit 0

      - name: Upload logs and images
        uses: actions/upload-artifact@v4
        with:
          name: m7350-v3-build-output
          path: |
            recon.txt
            build.log
            src/**/*.bin
            src/**/*.img
          if-no-files-found: warn
          retention-days: 30
